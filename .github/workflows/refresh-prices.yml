name: Refresh rental prices

on:
  schedule:
    # Every 3 hours. GitHub may delay scheduled runs by a few minutes at
    # busy times — that's normal, not a failure.
    #
    # Going to hourly ("0 * * * *") works mechanically, but weigh it first:
    # prices on these rentals don't move within an hour in any way that
    # matters for trip planning, while 24 scrape passes/day (vs. 8 at
    # 3-hourly) triples how often Airbnb/Vrbo/etc. see repeated automated
    # visits to the same listings from GitHub's shared runner IPs — which
    # is exactly what trips their bot detection and starts returning
    # CAPTCHAs instead of prices. 3-hourly is the steadier choice; switch
    # the line below to "0 * * * *" if you'd rather have hourly anyway.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed data/prices.json back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches the pip download cache (keyed to requirements.txt) so an
          # unchanged requirements.txt skips re-downloading the same wheels
          # every run — pip still "installs" them into the fresh runner's
          # site-packages each time (that part can't be skipped, GitHub
          # Actions VMs are wiped between runs), but it's pulling from the
          # local cache instead of PyPI, which is the slow part.
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # What the "Ubuntu" lines in the log are: Chromium needs a handful of
      # Linux system libraries (fonts, graphics, audio) to run. GitHub gives
      # every run a brand-new, empty Ubuntu machine, so nothing installed on
      # a previous run is still there — but the stock image already has most
      # of those libraries, so the install is often a no-op. This workflow
      # therefore (1) caches the Chromium *browser file* itself (~150MB,
      # keyed to requirements.txt, so it's only re-downloaded when the
      # playwright version changes), and (2) test-launches Chromium and only
      # runs the system-library install if that launch actually fails —
      # check first, install only if needed.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Download Chromium (only on a cache miss)
        run: playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install system libraries only if Chromium can't launch without them
        run: |
          if python -c "from playwright.sync_api import sync_playwright as sp; pw = sp().start(); pw.chromium.launch().close(); pw.stop()" 2>/dev/null; then
            echo "Chromium launches fine — system libraries already present, skipping install."
          else
            echo "Chromium couldn't launch — installing the missing system libraries."
            playwright install-deps chromium
          fi

      - name: Re-check every listing and write data/prices.json
        run: python scripts/scrape_prices.py

      - name: Commit updated prices, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "Refresh rental prices [automated]"
            git push
          fi
